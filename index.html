<style>

#top button{font-size:21px;padding:6px 6px;text-shadow:0 0 6px #000}#top .tg{font-size:13px;padding:3px 8px;margin-right:2px;border:1px solid #ffffff66;border-radius:14px;color:#fffd;text-shadow:none;background:#0005}#top .tg.on{background:var(--g);border-color:var(--g);color:#1a1206;font-weight:600}
#ttl{letter-spacing:3px;font-size:16px;padding-left:10px;color:var(--g);text-shadow:0 0 6px #000}

.tr i{display:block;height:100%;width:var(--p,0);background:#fff;border-radius:3px}
.tr b{position:absolute;top:50%;left:var(--p,0);width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:#fff;box-shadow:0 0 6px #000;transition:transform .15s}

.st{display:flex;justify-content:center;gap:44px}.st div{display:flex;flex-direction:column;gap:2px}.st b{font-size:19px}.st span{font-size:12px;color:#fff8}

.tabs button{flex:1;height:44px;color:#fff7;position:relative}.tabs button.on{color:#fff}.tabs button.on::after{content:"";position:absolute;left:30%;right:30%;bottom:0;height:2px;background:var(--g)}
.tabs .sb{flex:none;width:64px;font-size:13px;color:var(--g)}

.gr .on u{background:#d9b77944}.gr .on u::after{background:var(--g) ;border-color:var(--g);content:"✓";color:#1a1206;text-align:center;line-height:20px;font-weight:700}
.fl{display:block}
.fc{display:flex;align-items:center;gap:14px;padding:9px 16px;border-bottom:1px solid #ffffff10}.fc::after{content:'›';color:#fff5;font-size:24px}.fc .t{flex:1;min-width:0}.fc .cv{width:54px;height:54px;flex:none;border-radius:12px;background:#15141d center/cover;border:1px solid #ffffff18;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--g)}
.fc b{display:block;font-weight:500;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fc small{color:#fff7;display:block;margin-top:3px}#snd{position:fixed;left:50%;top:calc(var(--sf) + 58px);transform:translateX(-50%);z-index:6;background:#000b;border:1px solid var(--g);color:var(--g);padding:8px 16px;border-radius:20px;font-size:14px}

#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(circle at 50% 26%,#1d1733,#07070b 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:48px 40px calc(10vh + env(safe-area-inset-bottom))}
#lock img{width:min(300px,74vw);margin-bottom:44px}
#lock form{display:flex;flex-direction:column;gap:18px;width:min(360px,100%)}

#lock .gold{flex:none;height:58px;border-radius:29px;font-size:17px;letter-spacing:3px;margin-top:10px}
#fb{color:var(--g);padding:16px;margin-top:18px;font-size:15px;letter-spacing:1px}
#msg{color:#ff8a8a;min-height:22px;font-size:14px;margin-top:10px}
#sheet{position:fixed;inset:0;z-index:20;visibility:hidden;transition:visibility .3s}#sheet.on{visibility:visible}
.bk{position:absolute;inset:0;background:#0008;opacity:0;transition:opacity .3s}#sheet.on .bk{opacity:1}
.pn{position:absolute;left:0;right:0;bottom:var(--kb,0px);max-height:72dvh;min-height:30dvh;background:#17161f;border-radius:20px 20px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:env(safe-area-inset-bottom)}
#sheet.on .pn{transform:none}
.hd{display:flex;justify-content:space-between;padding:16px 18px 10px;font-weight:600}
#cl{flex:1;overflow-y:auto;padding:0 18px;-webkit-overflow-scrolling:touch}
#cl p{padding:12px 0;display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff12;word-break:break-all}
#cl small{display:block;color:#fff7;margin-top:3px}#cl em{color:var(--g);font-style:normal}#cl .tip{color:#fff8;font-size:13px;line-height:1.7;border:0}
#cl button{color:#fff7;padding:0 4px}
#cf{display:flex;gap:8px;padding:10px 14px}
#toast{position:fixed;left:50%;top:calc(var(--sf) + 56px);transform:translateX(-50%);background:#26242fee;padding:9px 18px;border-radius:20px;z-index:60;font-size:14px;white-space:nowrap}
.imm #top,.imm #rail,.imm #bar,.imm #pg,.imm #snd,.imm #toast,.imm #sheet{display:none!important}.imm #feed{bottom:0}
html,button,input{touch-action:manipulation}.tab:active,#top button:active,#rail button:active,#sel button:active{opacity:.55}
</style></head><body>
<div id="feedv" hidden>
 <div id="feed"></div><div id="empty" hidden>还没有作品<br>去「我的」点“导入作品”开始</div>

  <div class="st"><div><b id="n1">0</b><span>作品</span></div><div><b id="n2">0</b><span>收藏夹</span></div></div></div>

</div>

 <form id="cf" hidden><input id="ci" type="text" maxlength="500" autocomplete="off"><button class="gold">确定</button></form></div></div>

<script>
"use strict";
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
let imm=false,sw=0,WL=null,rnd=false,aut=false,FB=[],key=null,secs=[],cur=-1,picking=false,busy=false,dmOn=true,raf=0,tt,view='',fromMe=false,tab='w',fold=null,sm=false,onSub=null,rf=()=>{},pgD=false,skip=false;
const S=new Set(),P=[];let FD={f:[]};

/* ---------- Logo ---------- */
const LOGO=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="250"><stop offset="0" stop-color="#f7e6b8"/><stop offset="1" stop-color="#c08f52"/></linearGradient><mask id="m"><rect width="240" height="250" fill="#fff"/><circle cx="152" cy="92" r="33" fill="#000"/></mask></defs><circle cx="120" cy="112" r="98" fill="none" stroke="url(#g)" stroke-width="1.6" opacity=".75"/><circle cx="120" cy="112" r="92" fill="none" stroke="url(#g)" stroke-width=".6" opacity=".5"/><circle cx="100" cy="116" r="30" fill="url(#g)"/><circle cx="136" cy="102" r="38" fill="#e8eaf4" mask="url(#m)"/><g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"><path d="M120 188C118 173 110 164 99 158"/><path d="M120 188C122 171 130 161 141 155"/><path d="M120 188V158"/></g><text x="120" y="238" text-anchor="middle" font-family="Didot,'Bodoni 72',Georgia,serif" font-size="15" letter-spacing="6" fill="#d9b779">SUN MOON GRASS</text></svg>`;
const LU='data:image/svg+xml,'+encodeURIComponent(LOGO);
$('#lg').src=LU;$('#av').style.setProperty('--lu',`url("${LU}")`);
{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#07070b';g.fillRect(0,0,180,180);g.drawImage(i,15,10,150,156);$('#ico').href=c.toDataURL()};i.src=LU}

/* ---------- 存储 ---------- */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('priv',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('posts',{keyPath:'id'});d.createObjectStore('blobs',{keyPath:'id'});d.createObjectStore('notes',{keyPath:'id'}).createIndex('p','pid')};r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(st,mode,fn)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const kvGet=k=>tx('kv','readonly',s=>s.get(k)),kvPut=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- 加密 ---------- */
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function seal(buf){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,data:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf)}}
const open=(iv,data)=>crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
const sealJ=o=>seal(enc.encode(JSON.stringify(o))),openJ=async(iv,d)=>JSON.parse(dec.decode(await open(iv,d)));
const saveFD=async()=>kvPut('fav',await sealJ(FD));

/* ---------- 解锁 / 面容ID ---------- */
const msg=t=>$('#msg').textContent=t;
const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b))),ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
var fidReady=false;$('#lock').addEventListener('click',e=>{if(fidReady&&!e.target.closest('input,#lb'))fidUse(false)});
async function initLock(){const first=!(await kvGet('salt')),fid=!first&&!!(await kvGet('fid'));$('#pw2').hidden=!first;$('#lb').textContent=first?'设置密码并进入':'解锁';$('#fb').hidden=!fid;fidReady=fid;if(fid)fidUse(true)}
async function enter(){$('#pw').value=$('#pw2').value='';msg('');$('#lock').hidden=true;await loadAll();showFeed(P,null,false);scanDark()}
$('#lf').onsubmit=async e=>{e.preventDefault();const pw=$('#pw').value;if(!pw)return;msg('');
 try{const salt0=await kvGet('salt');
  if(!salt0){if(pw.length<6)return msg('密码至少 6 位');if(pw!==$('#pw2').value)return msg('两次输入不一致');
   const salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pw,salt);await kvPut('salt',salt);await kvPut('chk',await seal(enc.encode('ok')))}
  else{key=await derive(pw,salt0);const c=await kvGet('chk');await open(c.iv,c.data)}
 }catch(err){key=null;return msg('密码错误')}
 enter()};
async function fidUse(silent){try{const id=await kvGet('fid');if(!id)return;
 await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:ub(id)}],userVerification:'required',timeout:60000}});
 key=await crypto.subtle.importKey('raw',await kvGet('fk'),'AES-GCM',true,['encrypt','decrypt']);const c=await kvGet('chk');await open(c.iv,c.data);enter()}
 catch(e){key=null;if(!silent)msg('面容 ID 未通过，请输入密码')}}
async function fidOn(){try{const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'日月草的后宫'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'me',displayName:'me'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000}});
 await kvPut('fid',b64(c.rawId));await kvPut('fk',await crypto.subtle.exportKey('raw',key));toast('面容 ID 已开启')}catch(e){toast('开启失败：请用主屏幕图标打开，并在系统设置允许面容 ID',3000)}}
$('#cfg').onclick=async()=>{const on=!!(await kvGet('fid'));sh('设置',l=>{const p=document.createElement('p');p.innerHTML=`<span>面容 ID 解锁</span><em>${on?'已开启 · 点此关闭':'点此开启'}</em>`;p.onclick=async()=>{if(on){await kvPut('fid',null);await kvPut('fk',null);toast('已关闭')}else await fidOn();closeSheet()};
 const t=document.createElement('p');t.className='tip';t.textContent='面容 ID 只是快捷入口，密码仍然有效。忘记密码且未开启面容 ID 时数据无法恢复。';const q=document.createElement('p'),nb=P.filter(z=>!z.th||z.bad).length;q.innerHTML='<span>修复缩略图<small>重新生成黑色或缺失的封面</small></span><em>'+(nb?nb+' 个待修复 ›':'全部正常')+'</em>';q.onclick=()=>{closeSheet();regen()};l.append(p,q,t)})};
function lock(){imm&&setImm(false);key=null;cancelAnimationFrame(raf);secs.forEach(unload);io.disconnect();$('#feed').innerHTML='';secs=[];cur=-1;P.forEach(p=>p.th&&URL.revokeObjectURL(p.th));P.length=0;S.clear();sm=false;closeSheet();$('#feedv').hidden=$('#me').hidden=true;view='';$('#lock').hidden=false;cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);initLock()}
$('#lk').onclick=lock;
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(key&&!picking&&!busy)lock()}else setTimeout(()=>picking=false,1500)});
addEventListener('pagehide',()=>{if(key&&!busy)lock()});

/* ---------- 工具 ---------- */
function toast(t,ms=1800){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';document.body.append(e)}e.textContent=t;clearTimeout(tt);if(ms)tt=setTimeout(()=>e.remove(),ms)}
const clock=s=>{const x=s.x;return x.v&&x.media?x.media.currentTime:((performance.now()-x.t0)/1000)%20};
const fmt=t=>isFinite(t)?Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0'):'0:00';
function sh(t,fn,ph,sub){rf=fn;$('#sct').textContent=t;redo();onSub=sub||null;$('#cf').hidden=!sub;if(sub)$('#ci').placeholder=ph;$('#sheet').classList.add('on')}
function redo(){const l=$('#cl');l.innerHTML='';rf(l)}
