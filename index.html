<script>
"use strict";
const $=s=>document.querySelector(s),enc=new TextEncoder(),dec=new TextDecoder();
let imm=false,sw=0,WL=null,rnd=false,aut=false,FB=[],key=null,secs=[],cur=-1,picking=false,busy=false,dmOn=true,raf=0,tt,view='',fromMe=false,tab='w',fold=null,sm=false,onSub=null,rf=()=>{},pgD=false,skip=false;
const S=new Set(),P=[];let FD={f:[]};

/* ---------- Logo ---------- */
const LOGO=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 250"><defs><linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="240" y2="250"><stop offset="0" stop-color="#f7e6b8"/><stop offset="1" stop-color="#c08f52"/></linearGradient><mask id="m"><rect width="240" height="250" fill="#fff"/><circle cx="152" cy="92" r="33" fill="#000"/></mask></defs><circle cx="120" cy="112" r="98" fill="none" stroke="url(#g)" stroke-width="1.6" opacity=".75"/><circle cx="120" cy="112" r="92" fill="none" stroke="url(#g)" stroke-width=".6" opacity=".5"/><circle cx="100" cy="116" r="30" fill="url(#g)"/><circle cx="136" cy="102" r="38" fill="#e8eaf4" mask="url(#m)"/><g fill="none" stroke="url(#g)" stroke-width="3" stroke-linecap="round"><path d="M120 188C118 173 110 164 99 158"/><path d="M120 188C122 171 130 161 141 155"/><path d="M120 188V158"/></g><text x="120" y="238" text-anchor="middle" font-family="Didot,'Bodoni 72',Georgia,serif" font-size="15" letter-spacing="6" fill="#d9b779">SUN MOON GRASS</text></svg>`;
const LU='data:image/svg+xml,'+encodeURIComponent(LOGO);
$('#av').style.setProperty('--lu',`url("${LU}")`);
{const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=c.height=180;const g=c.getContext('2d');g.fillStyle='#07070b';g.fillRect(0,0,180,180);g.drawImage(i,15,10,150,156);$('#ico').href=c.toDataURL()};i.src=LU}

/* ---------- 存储 ---------- */
const DB=new Promise((ok,no)=>{const r=indexedDB.open('priv',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('kv');d.createObjectStore('posts',{keyPath:'id'});d.createObjectStore('blobs',{keyPath:'id'});d.createObjectStore('notes',{keyPath:'id'}).createIndex('p','pid')};r.onsuccess=()=>ok(r.result);r.onerror=no});
const tx=async(st,mode,fn)=>{const d=await DB;return new Promise((ok,no)=>{const t=d.transaction(st,mode),r=fn(t.objectStore(st));t.oncomplete=()=>ok(r&&r.result);t.onerror=()=>no(t.error)})};
const kvGet=k=>tx('kv','readonly',s=>s.get(k)),kvPut=(k,v)=>tx('kv','readwrite',s=>s.put(v,k));
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

/* ---------- 加密 ---------- */
async function derive(pw,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:300000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},true,['encrypt','decrypt'])}
async function seal(buf){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv,data:await crypto.subtle.encrypt({name:'AES-GCM',iv},key,buf)}}
const open=(iv,data)=>crypto.subtle.decrypt({name:'AES-GCM',iv},key,data);
const sealJ=o=>seal(enc.encode(JSON.stringify(o))),openJ=async(iv,d)=>JSON.parse(dec.decode(await open(iv,d)));
const saveFD=async()=>kvPut('fav',await sealJ(FD));

/* ---------- 入口页 / 状态保留 ---------- */
